<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stained Panes</title>
<style>
:root{--bg:#f1eee6;--panel:#ddd7c6;--ink:#262320;--soft:#cdc6b2;--empty:#f7f4ec;--lead:#26231f;--thin:rgba(0,0,0,.16);--clue:rgba(0,0,0,.6);--accent:#e4572e;--btn:#262320;--btnink:#f1eee6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--panel:#212329;--ink:#ece8dd;--soft:#363943;--empty:#23252b;--lead:#08090b;--thin:rgba(255,255,255,.1);--clue:rgba(255,255,255,.85);--accent:#ff7a50;--btn:#ece8dd;--btnink:#15161a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
button{font:inherit;color:var(--ink);border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);flex:none}
#lv{font-size:1.1rem;font-weight:800}
#rt{font-size:.9rem;font-weight:700;opacity:.75}
#prog{font-weight:700;font-variant-numeric:tabular-nums}
.sp{flex:1}
#msg{flex:none;min-height:2.7em;padding:4px 14px;font-size:.9rem;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.25}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px}
#board{display:grid;background:var(--lead);border:3px solid var(--lead);border-radius:8px;touch-action:none;overflow:hidden}
#board div{position:relative;border-style:solid}
#board svg{position:absolute;inset:0;margin:auto;width:60%;height:60%;fill:var(--clue);pointer-events:none}
#acts{flex:none;display:flex;gap:10px;padding:8px 12px 12px;max-width:560px;width:100%;margin:0 auto}
.btn{flex:1;font-weight:700;border-radius:12px;padding:8px 14px;min-height:48px;background:var(--soft);font-size:1rem}
.btn.go{background:var(--btn);color:var(--btnink)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (max-height:560px){#msg{display:none}}
</style>
</head>
<body>
<header><div id="lv">Level 1</div><div id="rt">Retries: 0</div><div class="sp"></div><div id="prog">0/0 panes</div></header>
<div id="msg" aria-live="polite"></div>
<main><div id="board" role="application" aria-label="Puzzle grid"></div></main>
<div id="acts"><button class="btn" id="un">Undo</button><button class="btn" id="hn">Hint</button><button class="btn" id="rs">Retry</button><button class="btn go" id="nx" hidden>Next level</button></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
const $=id=>document.getElementById(id);
const rnd=k=>Math.floor(Math.random()*k);
const pick=a=>a[rnd(a.length)];
const dark=matchMedia('(prefers-color-scheme:dark)');
let lvl=1,retries=0,n,R,owner,init,need,clueCell,clueShape,clueCanon,solOwner,hist,won,active,pending,changed,startI=-1,lastI=-1,moved,cellPx=40,full=false;
try{const s=+localStorage.getItem('glass-level');if(s>0)lvl=s}catch(e){}

function nb(i){
  const r=(i/n)|0,c=i%n,a=[];
  if(r>0)a.push(i-n);if(r<n-1)a.push(i+n);if(c>0)a.push(i-1);if(c<n-1)a.push(i+1);
  return a;
}
function shapeOf(cells){
  const pts=cells.map(i=>[(i/n)|0,i%n]);let best=null;
  for(let t=0;t<8;t++){
    const q=pts.map(([r,c])=>{let x=r,y=c;if(t&4)y=-y;for(let k=0;k<(t&3);k++){const z=x;x=y;y=-z}return[x,y]});
    const mr=Math.min(...q.map(p=>p[0])),mc=Math.min(...q.map(p=>p[1]));
    const s=q.map(p=>(p[0]-mr)+','+(p[1]-mc)).sort().join(';');
    if(best===null||s<best)best=s;
  }
  return best;
}
function gen(){
  n=Math.min(8,4+((lvl-1)>>1));
  const minS=2,maxS=Math.min(5,2+((lvl+1)>>1)),N2=n*n;
  for(let attempt=0;attempt<50;attempt++){
    const ow=Array(N2).fill(0),regs={};let k=0;
    const order=[...Array(N2).keys()].sort(()=>Math.random()-.5);
    for(const s of order){
      if(ow[s])continue;k++;
      const target=minS+rnd(maxS-minS+1),cells=[s];ow[s]=k;
      while(cells.length<target){
        const cand=[];cells.forEach(c=>nb(c).forEach(x=>{if(!ow[x]&&!cand.includes(x))cand.push(x)}));
        if(!cand.length)break;
        const x=pick(cand);ow[x]=k;cells.push(x);
      }
      regs[k]=cells;
    }
    Object.keys(regs).forEach(key=>{
      const id=+key,cells=regs[id];if(!cells||cells.length>=minS)return;
      const around=[];cells.forEach(c=>nb(c).forEach(x=>{if(ow[x]!==id)around.push(x)}));
      const t=ow[pick(around)];cells.forEach(c=>{ow[c]=t;regs[t].push(c)});delete regs[id];
    });
    const ids=Object.keys(regs).map(Number);
    if(ids.length<2)continue;
    R=ids.length;solOwner=Array(N2).fill(0);need=[0];clueCell=[0];clueShape=[0];clueCanon=[0];
    ids.forEach((id,j)=>{
      const k2=j+1,cells=regs[id];cells.forEach(c=>solOwner[c]=k2);
      need[k2]=cells.length;clueCell[k2]=pick(cells);clueCanon[k2]=shapeOf(cells);
      const pts=cells.map(i=>[(i/n)|0,i%n]),mr=Math.min(...pts.map(p=>p[0])),mc=Math.min(...pts.map(p=>p[1]));
      clueShape[k2]=pts.map(p=>[p[0]-mr,p[1]-mc]);
    });
    return;
  }
}
const color=(k,ok)=>{const h=(k*47+20)%360,d=dark.matches;return ok?`hsl(${h} 68% ${d?44:55}%)`:`hsl(${h} 50% ${d?24:80}%)`};
function regionOK(k){
  const cells=[];for(let i=0;i<owner.length;i++)if(owner[i]===k)cells.push(i);
  if(cells.length!==need[k])return false;
  const seen=new Set([cells[0]]),st=[cells[0]];
  while(st.length){const c=st.pop();nb(c).forEach(x=>{if(owner[x]===k&&!seen.has(x)){seen.add(x);st.push(x)}})}
  return seen.size===cells.length&&shapeOf(cells)===clueCanon[k];
}
function mount(){
  const b=$('board');b.innerHTML='';
  b.style.gridTemplateColumns=`repeat(${n},1fr)`;
  for(let i=0;i<n*n;i++){
    const d=document.createElement('div');
    const k=owner[i];
    if(k&&clueCell[k]===i){
      const sh=clueShape[k],w=Math.max(...sh.map(p=>p[1]))+1,h=Math.max(...sh.map(p=>p[0]))+1;
      d.innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${sh.map(p=>`<rect x="${p[1]+.06}" y="${p[0]+.06}" width=".88" height=".88" rx=".12"/>`).join('')}</svg>`;
    }
    b.appendChild(d);
  }
  size();
}
function size(){
  const m=document.querySelector('main'),s=Math.min(m.clientWidth-6,m.clientHeight-6);
  cellPx=Math.max(24,Math.floor((s-6)/n));
  const b=$('board');b.style.width=b.style.height=(cellPx*n+6)+'px';
}
function paint(){
  const cells=$('board').children,ok=[];let done=0;
  for(let k=1;k<=R;k++){ok[k]=regionOK(k);if(ok[k])done++}
  for(let i=0;i<n*n;i++){
    const o=owner[i],e=cells[i],r=(i/n)|0,c=i%n;
    e.style.background=o?color(o,ok[o]):'var(--empty)';
    const edge=(rr,cc)=>rr<0||rr>=n||cc<0||cc>=n||owner[rr*n+cc]!==o;
    const L='3px solid var(--lead)',T='1px solid var(--thin)';
    e.style.borderTop=edge(r-1,c)?L:T;e.style.borderBottom=edge(r+1,c)?L:T;
    e.style.borderLeft=edge(r,c-1)?L:T;e.style.borderRight=edge(r,c+1)?L:T;
  }
  $('prog').textContent=`${done}/${R} panes`;
  $('un').disabled=!hist.length;
  if(done===R&&!won)win();
}
const say=t=>$('msg').textContent=t;
function begin(){
  stopFx();gen();won=false;hist=[];active=null;
  owner=Array(n*n).fill(0);for(let k=1;k<=R;k++)owner[clueCell[k]]=k;
  init=owner.slice();
  $('lv').textContent='Level '+lvl;$('rt').textContent='Retries: '+retries;
  $('nx').hidden=true;['un','hn','rs'].forEach(id=>$(id).hidden=false);
  say('Drag from a clue cell to grow its pane into that shape. Shapes can be turned or flipped. Tap a cell to remove it.');
  mount();paint();
}
function win(){
  won=true;say('Window complete!'+(retries?` (${retries} ${retries===1?'retry':'retries'})`:''));
  $('nx').hidden=false;['un','hn','rs'].forEach(id=>$(id).hidden=true);
  try{localStorage.setItem('glass-level',lvl+1)}catch(e){}
  fireworks();
}
const bd=$('board');
function cellAt(e){
  const r=bd.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-3)/cellPx),y=Math.floor((e.clientY-r.top-3)/cellPx);
  return x>=0&&x<n&&y>=0&&y<n?y*n+x:-1;
}
bd.addEventListener('pointerdown',e=>{
  if(won)return;const i=cellAt(e);if(i<0)return;
  bd.setPointerCapture(e.pointerId);
  pending=owner.slice();changed=false;moved=false;full=false;startI=i;lastI=i;active=owner[i]||null;
});
bd.addEventListener('pointermove',e=>{
  if(!active||won)return;const i=cellAt(e);if(i<0||i===lastI)return;lastI=i;
  if(owner[i]!==0)return;
  if(owner.filter(o=>o===active).length>=need[active]){if(!full){say('That pane already has all its cells.');full=true}return}
  if(!nb(i).some(x=>owner[x]===active))return;
  owner[i]=active;changed=moved=true;paint();
});
bd.addEventListener('pointerup',()=>{
  if(won){active=null;return}
  if(!moved&&startI>=0&&owner[startI]&&clueCell[owner[startI]]!==startI){owner[startI]=0;changed=true;paint()}
  if(changed){hist.push(pending);if(hist.length>60)hist.shift();paint()}
  active=null;startI=lastI=-1;
});
bd.addEventListener('pointercancel',()=>{active=null;startI=lastI=-1});
bd.addEventListener('contextmenu',e=>e.preventDefault());
$('un').onclick=()=>{if(won||!hist.length)return;owner=hist.pop();paint()};
$('hn').onclick=()=>{
  if(won)return;const bad=[];for(let k=1;k<=R;k++)if(!regionOK(k))bad.push(k);
  if(!bad.length)return;const k=pick(bad);hist.push(owner.slice());
  for(let i=0;i<n*n;i++){if(solOwner[i]===k)owner[i]=k;else if(owner[i]===k)owner[i]=0}
  say('Filled in one pane for you.');paint();
};
$('rs').onclick=()=>{if(won)return;if(hist.length)retries++;owner=init.slice();hist=[];$('rt').textContent='Retries: '+retries;say('Fresh start. Drag from a clue cell.');paint()};
$('nx').onclick=()=>{lvl++;retries=0;begin()};
dark.addEventListener('change',paint);
addEventListener('resize',size);

const FXC=['#e4572e','#f2a900','#3fa34d','#1f8fd1','#7a52c7','#e0559a','#14b5a5'];
let fxRaf=0,parts=[];
function stopFx(){cancelAnimationFrame(fxRaf);fxRaf=0;parts=[];const c=$('fx');c.getContext('2d').clearRect(0,0,c.width,c.height)}
function burst(cx,cy){for(let i=0;i<60;i++){const a=Math.random()*6.283,v=2+Math.random()*5;
  parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:FXC[rnd(FXC.length)]})}}
function fireworks(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=$('fx'),x=c.getContext('2d'),dpr=window.devicePixelRatio||1,Wd=innerWidth,H=innerHeight;
  c.width=Wd*dpr;c.height=H*dpr;x.scale(dpr,dpr);
  let t=0,next=0;
  (function frame(){
    x.clearRect(0,0,Wd,H);
    if(t<150&&t>=next){burst(Wd*(.15+Math.random()*.7),H*(.15+Math.random()*.4));next=t+18+rnd(14)}
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l-=.011;x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,2.6,0,6.283);x.fill()});
    parts=parts.filter(p=>p.l>0);t++;
    if(t<150||parts.length)fxRaf=requestAnimationFrame(frame);else x.clearRect(0,0,Wd,H);
  })();
}
begin();
</script>
</body>
</html>
